
name: K8sGuard CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: k8sguard_initial/backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: k8sguard_initial/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Run Module A regression suite
        run: python -m pytest tests -q --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-results
          path: k8sguard_initial/backend/pytest-results.xml
          if-no-files-found: ignore

  backend-smoke:
    name: Fixture and API smoke tests
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: k8sguard_initial/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r k8sguard_initial/backend/requirements.txt

      - name: Scan fixture and validate response contract
        env:
          PYTHONPATH: k8sguard_initial/backend
        run: python k8sguard_initial/evaluation/ci_smoke.py

  frontend-build:
    name: Frontend build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: k8sguard_initial/frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Compile production frontend
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: k8sguard_initial/frontend/dist/
          if-no-files-found: error
          retention-days: 7
