apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: excessive
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grant-excessive
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: scanner
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: excessive
---
apiVersion: v1
kind: Pod
metadata:
  name: vulnerable-pod
  namespace: demo
spec:
  serviceAccountName: scanner
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        privileged: true
